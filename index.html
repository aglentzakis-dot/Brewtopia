function isoDatesInRange(fromISO, toISO) {
  const out = [];
  let d = new Date(fromISO + "T00:00:00");
  const end = new Date(toISO + "T00:00:00");
  let guard = 0;
  while (d <= end && guard < 400) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return out;
}

function lastScheduledOnOrBefore(days, dateISO) {
  if (!days || days.length === 0) return null;
  let d = new Date(dateISO + "T00:00:00");
  for (let i = 0; i < 8; i++) {
    if (days.includes(d.getDay())) return d.toISOString().slice(0, 10);
    d.setDate(d.getDate() - 1);
  }
  return null;
}

function wasCleanDoneInRange(cleanData, areaId, itemId, fromISO, toISO) {
  const key = `${areaId}__${itemId}`;
  for (const date of isoDatesInRange(fromISO, toISO)) {
    const mk = date.slice(0, 7);
    const dayEntry = cleanData?.[mk]?.[date];
    if (!dayEntry) continue;
    for (const s of SHIFTS) {
      const v = dayEntry?.[s]?.[key];
      if (v === "✓" || v === "*") return true;
    }
  }
  return false;
}

function shouldShowCleanItem(item, cleanData, areaId, refDateISO) {
  if (!item.days || item.days.length === 0) return true;
  const lastSched = lastScheduledOnOrBefore(item.days, refDateISO);
  if (!lastSched) return true;
  return !wasCleanDoneInRange(cleanData, areaId, item.id, lastSched, refDateISO);
}

const SHIFT_RANGES = { Α: [6, 14], Β: [14, 22], Γ: [22, 6] }; // ώρες έναρξης/λήξης (Γ διασχίζει τα μεσάνυχτα)

function getActiveShift(d = new Date()) {
  const h = d.getHours() + d.getMinutes() / 60;
  if (h >= 6 && h < 14) return "Α";
  if (h >= 14 && h < 22) return "Β";
  return "Γ";
}
function minutesUntilShiftEnd(d = new Date()) {
  const h = d.getHours() + d.getMinutes() / 60;
  const shift = getActiveShift(d);
  let diff;
  if (shift === "Γ") diff = h >= 22 ? (30 - h) : (6 - h);
  else diff = SHIFT_RANGES[shift][1] - h;
  return Math.max(0, Math.round(diff * 60));
}

const todayISO = () => new Date().toISOString().slice(0, 10);
const monthKey = (d = new Date()) => d.toISOString().slice(0, 7);
const uid = () => Math.random().toString(36).slice(2, 10);
const daysUntil = (iso) => {
  if (!iso) return null;
  const diff = (new Date(iso) - new Date(todayISO())) / 86400000;
  return Math.round(diff);
};

/* ============================================================
   STORAGE HOOK
   ============================================================ */
const STORAGE_PREFIX = "brewtopia:";

function useStore(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) {
      return initial;
    }
  });
  const loaded = true; // localStorage είναι σύγχρονο — φορτωμένο αμέσως

  const persist = useCallback((next) => {
    setValue(next);
    try {
      window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(next));
    } catch (e) {
      console.error("Αποτυχία αποθήκευσης", e);
    }
  }, [key]);

  return [value, persist, loaded];
}

// Πεδίο θερμοκρασίας που δέχεται αρνητικές τιμές κανονικά σε κινητό (χωρίς το πρόβλημα του type=number keypad)
const TempInput = ({ value, onChange, className = "" }) => {
  const handleChange = (e) => {
    let v = e.target.value.replace(",", ".");
    // επιτρέπει μόνο: προαιρετικό μείον στην αρχή, ψηφία, μία τελεία
    v = v.replace(/[^0-9.\-]/g, "");
    v = v.replace(/(?!^)-/g, ""); // μείον μόνο στην αρχή
    v = v.replace(/(\..*)\./g, "$1"); // μία μόνο τελεία
    onChange(v);
  };
  const toggleSign = () => {
    if (value === "" || value === undefined) { onChange("-"); return; }
    onChange(value.startsWith("-") ? value.slice(1) : "-" + value);
  };
  return (
    <div className={`flex items-center gap-1 ${className}`}>
      <button
        type="button"
        onClick={toggleSign}
        className="w-7 h-7 shrink-0 rounded-lg border border-slate-300 text-slate-500 font-bold text-sm flex items-center justify-center"
        aria-label="Εναλλαγή προσήμου"
      >±</button>
      <input
        type="text"
        inputMode="decimal"
        placeholder="°C"
        className="w-20 border border-slate-300 rounded-lg px-2 py-1 text-sm text-right"
        value={value ?? ""}
        onChange={handleChange}
      />
    </div>
  );
};

/* ============================================================
   SIGNATURE PAD
   ============================================================ */
function SignaturePad({ onSave, onCancel }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const empty = useRef(true);

  const getPos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  };

  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = getPos(e, canvas);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.stroke();
    empty.current = false;
  };
  const end = () => { drawing.current = false; };

  const clear = () => {
    const canvas = canvasRef.current;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    empty.current = true;
  };

  return (
    <div className="border-2 border-dashed border-teal-300 rounded-lg p-3 bg-teal-50/40">
      <canvas
        ref={canvasRef}
        width={320}
        height={140}
        className="bg-white border border-slate-300 rounded-lg touch-none w-full"
        style={{ maxWidth: 320 }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <div className="flex gap-2 mt-2">
        <button onClick={clear} className="text-xs px-3 py-1.5 rounded-lg border border-slate-300 flex items-center gap-1">
          <RotateCcw size={13} /> Καθαρισμός
        </button>
        <button
          onClick={() => {
            if (empty.current) return;
            onSave(canvasRef.current.toDataURL("image/png"));
          }}
          className="text-xs px-3 py-1.5 rounded-lg bg-teal-700 text-white flex items-center gap-1"
        >
          <Check size={13} /> Καταχώρηση υπογραφής
        </button>
        {onCancel && (
          <button onClick={onCancel} className="text-xs px-3 py-1.5 rounded-lg border border-slate-300 ml-auto">Άκυρο</button>
        )}
      </div>
    </div>
  );
}

function EmployeesTab({ employees, setEmployees }) {
  const [form, setForm] = useState(null);
  const [sortDir, setSortDir] = useState(null); // null | "asc" | "desc"
  const [showDeparted, setShowDeparted] = useState(false);

  const startNew = () => setForm({ id: uid(), name: "", phone: "", position: "", hireDate: "", healthExpiry: "", departureDate: "" });

  const save = () => {
    if (!form.name.trim()) return;
    const exists = employees.some((e) => e.id === form.id);
    const next = exists ? employees.map((e) => (e.id === form.id ? form : e)) : [...employees, form];
    setEmployees(next);
    setForm(null);
  };

  const remove = (id) => setEmployees(employees.filter((e) => e.id !== id));

  const active = employees.filter((e) => !e.departureDate);
  const departed = employees.filter((e) => e.departureDate);

  const displayed = [...active];
  if (sortDir) {
    displayed.sort((a, b) => {
      if (!a.hireDate) return 1;
      if (!b.hireDate) return -1;
      return sortDir === "asc" ? a.hireDate.localeCompare(b.hireDate) : b.hireDate.localeCompare(a.hireDate);
    });
  }

  const EmployeeCard = (e) => {
    const dLeft = daysUntil(e.healthExpiry);
    let badge = null;
    if (e.healthExpiry && !e.departureDate) {
      if (dLeft < 0) badge = <Stamp ok={false} textBad="ΛΗΓΜΕΝΟ ΒΙΒΛΙΑΡΙΟ" />;
      else if (dLeft <= HEALTH_WARN_DAYS) badge = <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded border-2 border-amber-500 text-amber-600">Λήγει σε {dLeft} ημ.</span>;
      else badge = <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded border-2 border-teal-600 text-teal-700">Βιβλιάριο εντάξει</span>;
    }
    return (
      <Card key={e.id} className="flex items-center justify-between">
        <div>
          <p className="font-semibold text-slate-800">{e.name}</p>
          <p className="text-xs text-slate-500">{e.position || "—"} · {e.phone || "χωρίς τηλέφωνο"}</p>
          {e.departureDate && <p className="text-[10px] text-slate-400 mt-0.5">Αποχώρησε: {e.departureDate}</p>}
          <div className="mt-1">{badge}</div>
        </div>
        <div className="flex gap-2">
          <button onClick={() => setForm(e)} className="text-xs px-3 py-1.5 border border-slate-300 rounded-lg">Επεξεργασία</button>
          <button onClick={() => remove(e.id)} className="text-xs px-2 py-1.5 border border-red-200 text-red-600 rounded-lg"><Trash2 size={14} /></button>
        </div>
      </Card>
    );
  };

  return (
    <div>
      <SectionTitle icon={Users} sub="Καρτέλες εργαζομένων, βιβλιάριο υγείας, ιστορικό εκπαίδευσης.">
        Προσωπικό
      </SectionTitle>

      <div className="flex items-center gap-2 mb-3">
        {!form && (
          <button onClick={startNew} className="flex items-center gap-1.5 bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
            <Plus size={16} /> Νέος εργαζόμενος
          </button>
        )}
        <div className="flex gap-1 ml-auto">
          <button
            onClick={() => setSortDir(sortDir === "asc" ? null : "asc")}
            className={`text-[11px] px-2.5 py-1.5 rounded-lg border font-semibold ${sortDir === "asc" ? "bg-slate-800 text-white border-slate-800" : "border-slate-300 text-slate-500"}`}
          >Παλιότεροι ↑</button>
          <button
            onClick={() => setSortDir(sortDir === "desc" ? null : "desc")}
            className={`text-[11px] px-2.5 py-1.5 rounded-lg border font-semibold ${sortDir === "desc" ? "bg-slate-800 text-white border-slate-800" : "border-slate-300 text-slate-500"}`}
          >Νεότεροι ↓</button>
        </div>
      </div>

      {form && (
        <Card className="mb-4">
          <Field label="Ονοματεπώνυμο">
            <input className={inputCls} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          </Field>
          <Field label="Τηλέφωνο">
            <input className={inputCls} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
          </Field>
          <Field label="Θέση">
            <input className={inputCls} value={form.position} onChange={(e) => setForm({ ...form, position: e.target.value })} />
          </Field>
          <Field label="Ημερομηνία πρόσληψης">
            <input type="date" className={inputCls} value={form.hireDate} onChange={(e) => setForm({ ...form, hireDate: e.target.value })} />
          </Field>
          <Field label="Λήξη βιβλιαρίου υγείας">
            <input type="date" className={inputCls} value={form.healthExpiry} onChange={(e) => setForm({ ...form, healthExpiry: e.target.value })} />
          </Field>
          <Field label="Ημερομηνία αποχώρησης (προαιρετικό)">
            <input type="date" className={inputCls} value={form.departureDate || ""} onChange={(e) => setForm({ ...form, departureDate: e.target.value })} />
          </Field>
          <div className="flex gap-2">
            <button onClick={save} className="bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1">
              <Save size={14} /> Αποθήκευση
            </button>
            <button onClick={() => setForm(null)} className="border border-slate-300 px-4 py-2 rounded-lg text-sm">Άκυρο</button>
          </div>
        </Card>
      )}

      <div className="space-y-2">
        {active.length === 0 && <p className="text-sm text-slate-400">Δεν έχουν καταχωρηθεί εργαζόμενοι ακόμα.</p>}
        {displayed.map(EmployeeCard)}
      </div>

      {departed.length > 0 && (
        <div className="mt-6 pt-4 border-t border-slate-200">
          <button onClick={() => setShowDeparted((v) => !v)} className="text-xs font-semibold text-slate-500 underline mb-2">
            {showDeparted ? "Απόκρυψη" : "Εμφάνιση"} Αποχωρησάντων ({departed.length})
          </button>
          {showDeparted && <div className="space-y-2 opacity-75">{departed.map(EmployeeCard)}</div>}
        </div>
      )}
    </div>
  );
}

function TrainingPackagesPanel({ employees, completions, setCompletions, requestPrint, businessInfo }) {
  const [openPkg, setOpenPkg] = useState(null);
  const [activeEmp, setActiveEmp] = useState(null);
  const [checked, setChecked] = useState([]);
  const [signing, setSigning] = useState(false);
  const [bulkMode, setBulkMode] = useState(false);
  const [bulkSelected, setBulkSelected] = useState([]);

  const findRecord = (pkgId, empId) => completions.find((c) => c.packageId === pkgId && c.employeeId === empId);

  const startFill = (pkgId, empId) => {
    const existing = findRecord(pkgId, empId);
    setActiveEmp(empId);
    setChecked(existing ? existing.checkedTopics : []);
    setSigning(false);
  };

  const toggleTopic = (topic) => {
    setChecked((c) => (c.includes(topic) ? c.filter((x) => x !== topic) : [...c, topic]));
  };

  const saveSignature = (pkg, dataUrl) => {
    const rec = { id: uid(), packageId: pkg.id, employeeId: activeEmp, date: todayISO(), checkedTopics: checked, signature: { img: dataUrl, at: new Date().toISOString() } };
    const others = completions.filter((c) => !(c.packageId === pkg.id && c.employeeId === activeEmp));
    setCompletions([rec, ...others]);
    setActiveEmp(null);
    setSigning(false);
  };

  const toggleBulkSelect = (empId) => {
    setBulkSelected((s) => (s.includes(empId) ? s.filter((x) => x !== empId) : [...s, empId]));
  };

  const applyBulkCheckAll = (pkg) => {
    const others = completions.filter((c) => !(c.packageId === pkg.id && bulkSelected.includes(c.employeeId)));
    const drafts = bulkSelected.map((empId) => {
      const existing = findRecord(pkg.id, empId);
      return { id: existing?.id || uid(), packageId: pkg.id, employeeId: empId, date: todayISO(), checkedTopics: [...pkg.topics], signature: existing?.signature || null };
    });
    setCompletions([...drafts, ...others]);
    setBulkSelected([]);
    setBulkMode(false);
  };

  return (
    <div className="space-y-3 mb-4">
      {TRAINING_PACKAGES.map((pkg) => {
        const isOpen = openPkg === pkg.id;
        return (
          <Card key={pkg.id}>
            <button className="w-full flex items-center justify-between text-left" onClick={() => { setOpenPkg(isOpen ? null : pkg.id); setActiveEmp(null); setBulkMode(false); setBulkSelected([]); }}>
              <div>
                <p className="font-semibold text-slate-800">{pkg.title}</p>
                <p className="text-xs text-slate-500">{pkg.note}</p>
              </div>
              <ChevronRight size={16} className={`transition-transform ${isOpen ? "rotate-90" : ""}`} />
            </button>

            {isOpen && (
              <div className="mt-3 border-t border-slate-100 pt-3 space-y-2">
                {employees.length === 0 && <p className="text-xs text-slate-400">Καταχώρησε πρώτα εργαζομένους στην καρτέλα «Προσωπικό».</p>}

                {employees.length > 0 && (
                  <div className="flex items-center justify-between mb-1">
                    <button
                      onClick={() => { setBulkMode((v) => !v); setBulkSelected([]); }}
                      className="text-[11px] text-teal-700 underline"
                    >
                      {bulkMode ? "Ακύρωση μαζικής επιλογής" : "Μαζική προεπιλογή θεμάτων για πολλούς"}
                    </button>
                    {bulkMode && bulkSelected.length > 0 && (
                      <button onClick={() => applyBulkCheckAll(pkg)} className="text-xs font-semibold bg-teal-700 text-white px-3 py-1.5 rounded-lg">
                        Τσεκάρισμα όλων ({bulkSelected.length})
                      </button>
                    )}
                  </div>
                )}
                {bulkMode && (
                  <p className="text-[11px] text-slate-500 mb-1">
                    Επίλεξε εργαζομένους — θα τσεκαριστούν αυτόματα όλα τα θέματα του πακέτου για τον καθένα. Η υπογραφή γίνεται μετά, ατομικά, από τον καθένα.
                  </p>
                )}

                {employees.map((emp) => {
                  const rec = findRecord(pkg.id, emp.id);
                  const isActive = activeEmp === emp.id;
                  const pendingSignature = rec && !rec.signature;
                  return (
                    <div key={emp.id} className="border border-slate-100 rounded-lg p-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-sm text-slate-700 flex items-center gap-2">
                          {bulkMode && (
                            <input
                              type="checkbox"
                              className="w-4 h-4 accent-teal-700"
                              checked={bulkSelected.includes(emp.id)}
                              onChange={() => toggleBulkSelect(emp.id)}
                            />

                          {emp.name}
                        </span>
                        {!bulkMode && (
                          rec?.signature ? (
                            <span className="text-[10px] font-bold uppercase px-2 py-1 rounded border-2 border-teal-600 text-teal-700">Ολοκληρώθηκε {rec.date}</span>

                          )
                        )}
                      </div>

                      {!bulkMode && rec?.signature && !isActive && (
                        <div className="mt-2">
                          <PrintButton onClick={() => requestPrint(<PackagePrintSheet pkg={pkg} employee={emp} record={rec} businessInfo={businessInfo} />)}>Εκτύπωση</PrintButton>

                      )}

                      {!bulkMode && isActive && (
                        <div className="mt-2 space-y-2">

                            <label key={t} className="flex items-start gap-2 text-xs text-slate-700">
                              <input type="checkbox" className="w-4 h-4 mt-0.5 accent-teal-700" checked={checked.includes(t)} onChange={() => toggleTopic(t)} />
                              {t}
                            </label>
                          ))}
                          {!signing ? (
                            <button
                              onClick={() => setSigning(true)}
                              disabled={checked.length !== pkg.topics.length}
                              className="w-full mt-2 bg-slate-800 disabled:bg-slate-300 text-white rounded-lg py-2 text-sm font-semibold flex items-center justify-center gap-1.5"
                            >
                              <FileSignature size={14} /> {checked.length !== pkg.topics.length ? `Τσέκαρε όλα τα θέματα (${checked.length}/${pkg.topics.length})` : "Προχώρα σε υπογραφή"}
                            </button>
                          ) : (
                            <SignaturePad onSave={(d) => saveSignature(pkg, d)} onCancel={() => setSigning(false)} />
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

                    </li>
                  ))}
                </ul>
              </div>
            );
          })()}
        </div>
      ))}
    </div>
  );

const isoToDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };

function daysSinceLastCleanMark(key, cleanData) {
  let lastISO = null;
  Object.values(cleanData || {}).forEach((days) => {
    Object.entries(days || {}).forEach(([dateISO, shifts]) => {
      const marked = SHIFTS.some((s) => shifts?.[s]?.[key]);
      if (marked && (!lastISO || dateISO > lastISO)) lastISO = dateISO;
    });
  });
  if (!lastISO) return null;
  return Math.floor((isoToDate(todayISO()) - isoToDate(lastISO)) / 86400000);
}

function MonthlyCleaningGrid({ cleaningAreas, cleanData, month }) {
  const [y, m] = month.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const dayCols = Array.from({ length: daysInMonth }, (_, i) => i + 1);

  const rows = [];
  cleaningAreas.forEach((group) => {
    group.items.forEach((item) => rows.push({ key: `${group.id}__${item.id}`, name: item.name, area: group.area }));
  });

  return (
    <Card className="overflow-x-auto">
      <p className="text-xs font-bold uppercase tracking-wide text-teal-800 mb-2">Μηνιαίος Πίνακας Καθαριότητας — {month}</p>
      <table className="border-collapse text-[10px]">
        <thead>
          <tr>
            <th className="sticky left-0 bg-white border border-slate-200 px-2 py-1 text-left">Σημείο</th>
            {dayCols.map((d) => <th key={d} className="border border-slate-200 px-1 py-1 w-6 text-center">{d}</th>)}
          </tr>
        </thead>
        <tbody>
          {rows.map((r) => {
            const overdue = (daysSinceLastCleanMark(r.key, cleanData) ?? 9999) >= 25;
            return (
              <tr key={r.key}>
                <td className={`sticky left-0 border border-slate-200 px-2 py-1 whitespace-nowrap font-medium ${overdue ? "bg-red-100 text-red-700" : "bg-white text-slate-700"}`}>
                  {r.name}
                </td>
                {dayCols.map((d) => {
                  const dateISO = `${month}-${String(d).padStart(2, "0")}`;
                  const done = SHIFTS.some((s) => cleanData?.[month]?.[dateISO]?.[s]?.[r.key]);
                  return (
                    <td key={d} className={`border border-slate-200 w-6 h-6 text-center ${done ? "bg-teal-500" : ""}`}></td>
                  );
                })}
              </tr>
            );
          })}
          {rows.length === 0 && (
            <tr><td className="px-2 py-2 text-slate-400" colSpan={daysInMonth + 1}>Δεν υπάρχουν σημεία καθαριότητας.</td></tr>
          )}
        </tbody>
      </table>
      <p className="text-[10px] text-slate-400 mt-2">Πράσινο = έγινε καθαριότητα εκείνη τη μέρα. Κόκκινο όνομα = πάνω από 25 μέρες χωρίς καμία καταχώρηση.</p>
    </Card>
  );
}

    const j = idx + dir;
    if (j < 0 || j >= next.length) return;
    [next[idx], next[j]] = [next[j], next[idx]];
    setCleaningAreas(next);
  };
  const removeCleanArea = (idx) => setCleaningAreas(cleaningAreas.filter((_, i) => i !== idx));
  const addCleanArea = (areaName) => {
    if (!areaName.trim()) return;
    setCleaningAreas([...cleaningAreas, { id: uid(), area: areaName, items: [] }]);
  };
  const renameCleanArea = (idx, name) => {
    const next = cleaningAreas.map((g, i) => (i === idx ? { ...g, area: name } : g));
    setCleaningAreas(next);
  };
  const moveCleanItem = (gIdx, iIdx, dir) => {
    const next = cleaningAreas.map((g) => ({ ...g, items: [...g.items] }));
    const items = next[gIdx].items;
    const j = iIdx + dir;
    if (j < 0 || j >= items.length) return;
    [items[iIdx], items[j]] = [items[j], items[iIdx]];
    setCleaningAreas(next);
  };
  const removeCleanItem = (gIdx, iIdx) => {
    const next = cleaningAreas.map((g, i) => (i === gIdx ? { ...g, items: g.items.filter((_, ii) => ii !== iIdx) } : g));
    setCleaningAreas(next);
  };
  const addCleanItem = (gIdx, name, freq) => {
    if (!name.trim()) return;
    const next = cleaningAreas.map((g, i) => (i === gIdx ? { ...g, items: [...g.items, { id: uid(), name, freq: freq || "—" }] } : g));
    setCleaningAreas(next);
  };
  const renameCleanItem = (gIdx, iIdx, field, val) => {
    const next = cleaningAreas.map((g, i) => {
      if (i !== gIdx) return g;
      const items = g.items.map((it, ii) => (ii === iIdx ? { ...it, [field]: val } : it));
      return { ...g, items };
    });
    setCleaningAreas(next);
  };
  const toggleCleanItemDay = (gIdx, iIdx, dayIdx) => {
    const next = cleaningAreas.map((g, i) => {
      if (i !== gIdx) return g;
      const items = g.items.map((it, ii) => {
        if (ii !== iIdx) return it;
        const days = it.days || [];
        const nextDays = days.includes(dayIdx) ? days.filter((d) => d !== dayIdx) : [...days, dayIdx];
        return { ...it, days: nextDays };
      });
      return { ...g, items };
    });
    setCleaningAreas(next);
  };

  const mk = monthKey(new Date(date));

  // --- temps ---
  const dayTemps = ccpData?.[mk]?.[date]?.[shift] || {};
  const setTemp = (stationId, val) => {
    const next = { ...ccpData };
    next[mk] = next[mk] || {};
    next[mk][date] = next[mk][date] || {};
    next[mk][date][shift] = { ...next[mk][date][shift], [stationId]: val };
    setCcpData(next);
  };

  // --- display cases ---
  const dayDisplay = ccpData?.[mk]?.[date]?.[shift]?._display || {};
  const setDisplay = (id, val) => {
    const next = { ...ccpData };
    next[mk] = next[mk] || {};
    next[mk][date] = next[mk][date] || {};
    next[mk][date][shift] = next[mk][date][shift] || {};
    next[mk][date][shift]._display = { ...next[mk][date][shift]._display, [id]: val };
    setCcpData(next);
  };

  // --- oil ---
  const dayOil = oilData?.[mk]?.[date] || {};
  const setOil = (field, val) => {
    const next = { ...oilData };
    next[mk] = next[mk] || {};
    next[mk][date] = { ...next[mk][date], [field]: val };
    setOilData(next);
  };

  // --- cleaning ---
  const dayClean = cleanData?.[mk]?.[date]?.[shift] || {};
  const setClean = (key, val) => {
    const next = { ...cleanData };
    next[mk] = next[mk] || {};
    next[mk][date] = next[mk][date] || {};
    next[mk][date][shift] = { ...next[mk][date][shift], [key]: val };
    setCleanData(next);
  };

  // --- διορθωτικές ενέργειες (ψυγεία) ---
  const dayActions = ccpData?.[mk]?.[date]?.[shift]?._actions || {};
  const setStationAction = (stationId, val) => {
    const next = { ...ccpData };
    next[mk] = next[mk] || {};
    next[mk][date] = next[mk][date] || {};
    next[mk][date][shift] = next[mk][date][shift] || {};
    next[mk][date][shift]._actions = { ...next[mk][date][shift]._actions, [stationId]: val };
    setCcpData(next);
  };

  // --- διορθωτικές ενέργειες (βιτρίνες) ---
  const dayDisplayActions = ccpData?.[mk]?.[date]?.[shift]?._displayActions || {};
  const setDisplayAction = (id, val) => {
    const next = { ...ccpData };
    next[mk] = next[mk] || {};
    next[mk][date] = next[mk][date] || {};
    next[mk][date][shift] = next[mk][date][shift] || {};
    next[mk][date][shift]._displayActions = { ...next[mk][date][shift]._displayActions, [id]: val };
    setCcpData(next);
  };

  const evalStation = (st, val) => {
    if (val === "" || val === undefined || val === "-") return null;
    const n = parseFloat(val);
    if (Number.isNaN(n)) return null;
    if (st.type === "freezer") return n <= -16;
    if (st.type === "fridge") return n <= 7;
    return true;
  };

  const subTabsBase = [
    { id: "temps", icon: Snowflake, defaultLabel: "Ψυγεία / Κατάψυξη" },
    { id: "clean", icon: Sparkles, defaultLabel: "Καθαριότητα" },
    { id: "oil", icon: Droplet, defaultLabel: "Λάδι τηγανίσματος" },
    { id: "display", icon: Thermometer, defaultLabel: "Παγωτό" },
  ];
  const subTabs = subTabsBase.map((t) => ({ ...t, label: subTabLabels[t.id] || t.defaultLabel }));

  return (
    <div>
      <SectionTitle icon={ClipboardList} sub="Καθημερινή καταγραφή θερμοκρασιών, λαδιού και καθαριότητας ανά βάρδια.">
        Ημερήσιες Καταγραφές
      </SectionTitle>

      {showReminder && (
        <Card className="mb-4 border-2 border-amber-400 bg-amber-50">
          <div className="flex items-start gap-2">
            <AlertTriangle size={18} className="text-amber-600 shrink-0 mt-0.5" />
            <div className="flex-1">
              <p className="text-sm font-bold text-amber-800">
                Η βάρδια «{shiftNames[activeShift] || activeShift}» {minsLeft > 0 ? `τελειώνει σε ${minsLeft} λεπτά` : "μόλις τελείωσε"}
              </p>
              <p className="text-xs text-amber-700 mt-0.5">Δεν έχουν καταχωρηθεί ακόμα όλες οι θερμοκρασίες ψυγείων για σήμερα.</p>
              <button
                onClick={() => { setDate(todayKey); setShift(activeShift); setSub("temps"); }}
                className="mt-2 text-xs font-semibold bg-amber-500 text-white px-3 py-1.5 rounded-lg"
              >
                Καταχώρηση τώρα
              </button>
            </div>
          </div>
        </Card>
      )}

      <Card className="mb-4">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Ημερομηνία">
            <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
          </Field>
          <Field label="Βάρδια">
            <div className="flex gap-2 mt-1">
              {SHIFTS.map((s) => {
                const lit = shift === s;
                return (
                  <button
                    key={s}
                    onClick={() => selectShift(s)}
                    className={`flex-1 py-2 rounded-lg text-xs font-bold border-2 transition-all ${
                      lit
                        ? "bg-amber-400 border-amber-500 text-slate-900 shadow-[0_0_0_3px_rgba(251,191,36,0.35)]"
                        : "border-slate-300 text-slate-500 bg-white"
                    }`}
                  >{shiftNames[s] || s}</button>
                );
              })}
            </div>
          </Field>
        </div>
        {wrongShiftWarning && wrongShiftWarning === shift && (
          <p className="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1.5 mt-2 flex items-center gap-1.5">
            <AlertTriangle size={12} className="shrink-0" />
            Αυτή τη στιγμή σε εξέλιξη είναι η βάρδια «{shiftNames[activeShift] || activeShift}» — βεβαιώσου ότι θες να καταχωρήσεις σε άλλη βάρδια.
          </p>
        )}
        <button onClick={() => setEditingShifts((v) => !v)} className="text-[11px] text-teal-700 underline mt-1">
          {editingShifts ? "Κλείσιμο" : "Μετονομασία βαρδιών"}
        </button>
        {editingShifts && (
          <div className="grid grid-cols-3 gap-2 mt-2">
            {SHIFTS.map((s) => (
              <input
                key={s}
                className="border border-slate-300 rounded-lg px-2 py-1 text-xs"
                value={shiftNames[s] || ""}
                onChange={(e) => setShiftNames({ ...shiftNames, [s]: e.target.value })}
              />
            ))}
          </div>
        )}
      </Card>

      <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
        {subTabs.map((t) => (
          <button
            key={t.id}
            onClick={() => setSub(t.id)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border ${
              sub === t.id ? "bg-slate-800 text-white border-slate-800" : "border-slate-300 text-slate-600"
            }`}
          >
            <t.icon size={13} /> {t.label}
          </button>
        ))}
      </div>

      {sub === "temps" && (
        <Card>
          <div className="mb-3 inline-flex items-center gap-1.5 bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
            <Thermometer size={13} /> Ψυγεία ≤ 7°C &nbsp;·&nbsp; Κατάψυξη ≤ -16°C
          </div>

          {!editingStations && (
            <div className="space-y-2">
              {stations.map((st) => {
                const val = dayTemps[st.id] ?? "";
                const ok = evalStation(st, val);
                const outOfRange = val !== "" && val !== "-" && ok === false;
                return (
                  <div key={st.id} className="border-b border-slate-100 pb-2">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-sm text-slate-700 flex items-center gap-1.5">
                        {st.type !== "dry" && <Snowflake size={13} className={st.type === "freezer" ? "text-sky-500" : "text-teal-500"} />}
                        {st.name}
                      </span>
                      <div className="flex items-center gap-2">
                        {st.type !== "dry" && (
                          <>
                            <TempInput value={val} onChange={(v) => setTemp(st.id, v)} />
                            {val !== "" && val !== "-" && <Stamp ok={ok} />}
                          </>
                        )}
                      </div>
                    </div>
                    {outOfRange && (
                      <CorrectiveActionPanel value={dayActions[st.id]} onChange={(v) => setStationAction(st.id, v)} />
                    )}
                  </div>
                );
              })}
              <button
                onClick={() => setEditingStations(true)}
                className="text-[11px] text-slate-400 underline pt-1"
              >
                Επεξεργασία λίστας σταθμών
              </button>
            </div>
          )}

          {editingStations && (
            <div className="space-y-2">
              <p className="text-xs text-slate-500 mb-1">Με τα βελάκια αλλάζεις τη σειρά. Πάτα στο όνομα για να το αλλάξεις.</p>
              {stations.map((st, idx) => (
                <div key={st.id} className="border border-slate-200 rounded-lg p-2 space-y-2">
                  <div className="flex items-center gap-2">
                    <div className="flex flex-col">
                      <button onClick={() => moveStation(idx, -1)} disabled={idx === 0}
                        className="w-7 h-6 flex items-center justify-center rounded border border-slate-300 text-slate-500 disabled:opacity-30">▲</button>
                      <button onClick={() => moveStation(idx, 1)} disabled={idx === stations.length - 1}
                        className="w-7 h-6 flex items-center justify-center rounded border border-slate-300 text-slate-500 disabled:opacity-30 mt-0.5">▼</button>
                    </div>
                    <input
                      className="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"
                      value={st.name}
                      onChange={(e) => renameStation(idx, e.target.value)}
                    />
                    <button onClick={() => removeStation(idx)} className="w-8 h-8 shrink-0 rounded-lg border border-red-200 text-red-600 flex items-center justify-center">
                      <Trash2 size={14} />
                    </button>
                  </div>
                  <div className="flex gap-1.5 pl-9">
                    {[["fridge", "Ψυγείο (≤7°C)"], ["freezer", "Κατάψυξη (≤-16°C)"], ["dry", "Χωρίς θερμοκρασία"]].map(([val, label]) => (
                      <button
                        key={val}
                        onClick={() => setStationType(idx, val)}
                        className={`text-[10px] px-2 py-1 rounded-full border ${st.type === val ? "bg-teal-700 text-white border-teal-700" : "border-slate-300 text-slate-500"}`}
                      >{label}</button>
                    ))}
                  </div>
                </div>
              ))}
              <button onClick={addStation} className="w-full flex items-center justify-center gap-1.5 border-2 border-dashed border-slate-300 text-slate-500 rounded-lg py-2 text-sm font-semibold">
                <Plus size={15} /> Προσθήκη σταθμού
              </button>
              <button onClick={() => setEditingStations(false)} className="w-full bg-slate-800 text-white rounded-lg py-2 text-sm font-semibold">
                Τέλος επεξεργασίας
              </button>
            </div>
          )}
        </Card>
      )}

      {sub === "display" && (
        <Card>
          {!editingDisplay && (
            <div className="space-y-2">
              {displayItems.map((d) => {
                const val = dayDisplay[d.id] ?? "";
                const ok = val === "" || val === "-" ? null : parseFloat(val) <= d.limit;
                const outOfRange = val !== "" && val !== "-" && ok === false;
                return (
                  <div key={d.id} className="border-b border-slate-100 pb-2">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-sm text-slate-700">{d.name}<LimitBadge>&lt;{d.limit}°C</LimitBadge></span>
                      <div className="flex items-center gap-2">
                        <TempInput value={val} onChange={(v) => setDisplay(d.id, v)} />
                        {val !== "" && val !== "-" && <Stamp ok={ok} />}
                      </div>
                    </div>
                    {outOfRange && (
                      <CorrectiveActionPanel value={dayDisplayActions[d.id]} onChange={(v) => setDisplayAction(d.id, v)} />
                    )}
                  </div>
                );
              })}
              <p className="text-xs text-amber-600 pt-1 flex items-start gap-1">
                <AlertTriangle size={13} className="mt-0.5 shrink-0" />
                Απόρριψη προϊόντων εκτός ορίων εάν δεν καταναλωθούν εντός 4 ωρών.
              </p>
              <button onClick={() => setEditingDisplay(true)} className="text-[11px] text-slate-400 underline pt-1">
                Επεξεργασία λίστας βιτρινών
              </button>
            </div>
          )}

          {editingDisplay && (
            <div className="space-y-2">
              <p className="text-xs text-slate-500 mb-1">Με τα βελάκια αλλάζεις τη σειρά. Πάτα στο όνομα ή στο όριο για να τα αλλάξεις.</p>
              {displayItems.map((d, idx) => (
                <div key={d.id} className="border border-slate-200 rounded-lg p-2 space-y-2">
                  <div className="flex items-center gap-2">
                    <div className="flex flex-col">
                      <button onClick={() => moveDisplayItem(idx, -1)} disabled={idx === 0}
                        className="w-7 h-6 flex items-center justify-center rounded border border-slate-300 text-slate-500 disabled:opacity-30">▲</button>
                      <button onClick={() => moveDisplayItem(idx, 1)} disabled={idx === displayItems.length - 1}
                        className="w-7 h-6 flex items-center justify-center rounded border border-slate-300 text-slate-500 disabled:opacity-30 mt-0.5">▼</button>
                    </div>
                    <input
                      className="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"
                      value={d.name}
                      onChange={(e) => renameDisplayItem(idx, e.target.value)}
                    />
                    <div className="flex items-center gap-1 shrink-0">
                      <span className="text-[10px] text-slate-400">&lt;</span>
                      <input
                        type="number" step="0.5"
                        className="w-14 border border-slate-300 rounded-lg px-1.5 py-1.5 text-sm"
                        value={d.limit}
                        onChange={(e) => setDisplayLimit(idx, e.target.value)}
                      />
                      <span className="text-[10px] text-slate-400">°C</span>
                    </div>
                    <button onClick={() => removeDisplayItem(idx)} className="w-8 h-8 shrink-0 rounded-lg border border-red-200 text-red-600 flex items-center justify-center">
                      <Trash2 size={14} />
                    </button>
                  </div>
                </div>
              ))}
              <button onClick={addDisplayItem} className="w-full flex items-center justify-center gap-1.5 border-2 border-dashed border-slate-300 text-slate-500 rounded-lg py-2 text-sm font-semibold">
                <Plus size={15} /> Προσθήκη βιτρίνας
              </button>
              <button onClick={() => setEditingDisplay(false)} className="w-full bg-slate-800 text-white rounded-lg py-2 text-sm font-semibold">
                Τέλος επεξεργασίας
              </button>
            </div>
          )}
        </Card>
      )}

      {sub === "oil" && (
        <Card>
          <Field label="Θερμοκρασία λαδιού">
            <LimitBadge>&lt;179°C</LimitBadge>
            <div className="flex items-center gap-2 mt-2">
              <TempInput value={dayOil.temp ?? ""} onChange={(v) => setOil("temp", v)} />
              {dayOil.temp !== undefined && dayOil.temp !== "" && dayOil.temp !== "-" && <Stamp ok={parseFloat(dayOil.temp) < 179} />}
            </div>
          </Field>
          {dayOil.temp !== undefined && dayOil.temp !== "" && dayOil.temp !== "-" && parseFloat(dayOil.temp) >= 179 && (
            <CorrectiveActionPanel value={dayOil._action} onChange={(v) => setOil("_action", v)} actions={OIL_CORRECTIVE_ACTIONS} />
          )}
          {[
            ["appearance", "Εμφάνιση λαδιού φυσιολογική"],
            ["colorSmell", "Χρώμα – οσμή – γεύση φυσιολογικά"],
            ["filtered", "Έγινε φιλτράρισμα"],
          ].map(([key, label]) => (
            <label key={key} className="flex items-center gap-2 mb-2 text-sm text-slate-700">
              <input type="checkbox" checked={!!dayOil[key]} onChange={(e) => setOil(key, e.target.checked)} className="w-4 h-4 accent-teal-700" />
              {label}
            </label>
          ))}
          <label className="flex items-center gap-2 mt-3 text-sm font-semibold text-slate-800">
            <input type="checkbox" checked={!!dayOil.changed} onChange={(e) => setOil("changed", e.target.checked)} className="w-4 h-4 accent-teal-700" />
            <Flame size={14} className="text-orange-500" /> Έγινε αλλαγή λαδιού σήμερα (κανονικά Τρί / Πέμ / Κυρ)
          </label>
        </Card>
      )}


      {sub === "clean" && (
        <div className="space-y-3">
          {!editingClean && cleaningAreas.map((group) => {
            const visibleItems = group.items.filter((item) => shouldShowCleanItem(item, cleanData, group.id, date));
            if (visibleItems.length === 0) return null;
            const todayShifts = cleanData?.[mk]?.[date] || {};
            return (
              <Card key={group.id}>
                <p className="text-xs font-bold uppercase tracking-wide text-teal-800 mb-2">{group.area}</p>
                <div className="space-y-1.5">
                  {visibleItems.map((item) => {
                    const key = `${group.id}__${item.id}`;
                    const val = dayClean[key] || "";
                    const scheduled = item.days && item.days.length > 0;
                    const otherShiftDone = scheduled && !val
                      ? SHIFTS.find((s) => s !== shift && todayShifts?.[s]?.[key])
                      : null;
                    const expanded = expandedClean[key];

                    if (otherShiftDone && !expanded) {
                      return (
                        <div key={key} className="flex items-center justify-between text-xs gap-2 py-0.5 opacity-70">
                          <span className="text-slate-500">{item.name} — ✓ έγινε ({shiftNames[otherShiftDone] || otherShiftDone})</span>
                          <button
                            onClick={() => setExpandedClean({ ...expandedClean, [key]: true })}
                            className="text-teal-700 underline shrink-0"
                          >Ξαναμαρκάρισμα</button>
                        </div>
                      );
                    }

                    return (
                      <div key={key} className="flex items-center justify-between text-sm gap-2">
                        <div>
                          <p className="text-slate-700">{item.name}</p>
                          <p className="text-[10px] text-slate-400">{item.freq}</p>
                        </div>
                        <div className="flex gap-1">
                          {[["✓", "teal"], ["Χ", "red"], ["*", "amber"]].map(([mark, color]) => (
                            <button
                              key={mark}
                              onClick={() => setClean(key, val === mark ? "" : mark)}
                              className={`w-8 h-8 rounded-lg border-2 font-bold text-sm
                                ${val === mark
                                  ? color === "teal" ? "bg-teal-700 border-teal-700 text-white"
                                  : color === "red" ? "bg-red-600 border-red-600 text-white"
                                  : "bg-amber-500 border-amber-500 text-white"
                                  : "border-slate-300 text-slate-500"}`}
                            >{mark}</button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            );
          })}
          {!editingClean && (
            <p className="text-xs text-slate-500">✓ έγινε έλεγχος και είναι καθαρά · Χ εντοπίστηκε πρόβλημα · * έγινε καθαριότητα</p>
          )}

          {editingClean && (
            <>
              <p className="text-[11px] text-slate-500">
                Πάτα πάνω σε τίτλο ή όνομα σημείου για να το αλλάξεις. Με τα βελάκια αλλάζεις σειρά. Επίλεξε ημέρες αν θες το σημείο να εμφανίζεται μόνο συγκεκριμένες μέρες (αν δεν καθαριστεί, συνεχίζει να εμφανίζεται τις επόμενες μέρες μέχρι να γίνει) — χωρίς επιλογή, εμφανίζεται κάθε μέρα όπως τώρα.
              </p>
              {cleaningAreas.map((group, gIdx) => (
                <Card key={group.id}>
                  <div className="flex items-center gap-2 mb-2">
                    <div className="flex flex-col">
                      <button onClick={() => moveCleanArea(gIdx, -1)} disabled={gIdx === 0}
                        className="w-7 h-6 flex items-center justify-center rounded border border-slate-300 text-slate-500 disabled:opacity-30">▲</button>
                      <button onClick={() => moveCleanArea(gIdx, 1)} disabled={gIdx === cleaningAreas.length - 1}
                        className="w-7 h-6 flex items-center justify-center rounded border border-slate-300 text-slate-500 disabled:opacity-30 mt-0.5">▼</button>
                    </div>
                    <input
                      value={group.area}
                      onChange={(e) => renameCleanArea(gIdx, e.target.value)}
                      className="text-xs font-bold uppercase tracking-wide text-teal-800 flex-1 bg-transparent border-b border-dashed border-teal-300 focus:outline-none focus:border-teal-600 py-0.5"
                    />

/* ============================================================
   TAB: ΑΡΧΕΙΟΘΕΤΗΣΗ / ΚΑΤΑΣΤΡΟΦΗ ΕΝΤΥΠΩΝ
   ============================================================ */
function BackupPanel({ getBackupText, onImport }) {
  const [mode, setMode] = useState(null); // "export" | "import"
  const [exportText, setExportText] = useState("");
  const [importText, setImportText] = useState("");
  const [status, setStatus] = useState(null);
  const [copied, setCopied] = useState(false);

  const openExport = () => {
    setExportText(getBackupText());
    setMode("export");
    setStatus(null);
    setCopied(false);
  };

  const copyExport = async () => {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopied(true);
    } catch {
      setCopied(false);
      setStatus({ ok: false, msg: "Η αυτόματη αντιγραφή απέτυχε — επίλεξε το κείμενο με το χέρι και αντέγραψέ το." });
    }
  };

  const applyImport = () => {
    try {
      const data = JSON.parse(importText);
      onImport(data);
      setStatus({ ok: true, msg: "Τα δεδομένα επαναφέρθηκαν επιτυχώς." });
      setMode(null);
      setImportText("");
    } catch (err) {
      setStatus({ ok: false, msg: "Το κείμενο δεν αναγνωρίστηκε ως έγκυρο αντίγραφο ασφαλείας." });
    }
  };

  return (
    <Card className="mb-4 border-2 border-slate-800">
      <p className="text-xs font-bold uppercase tracking-wide text-slate-800 mb-1 flex items-center gap-1.5">
        <Save size={14} /> Αντίγραφο Ασφαλείας
      </p>
      <p className="text-xs text-slate-500 mb-3">
        Αντέγραψε όλα τα δεδομένα σε κείμενο και φύλαξέ τα κάπου (σημειώσεις, email). Αν χρειαστεί αναβάθμιση, επικόλλησέ τα πίσω για να επανέλθουν όλα.
      </p>
      {!mode && (
        <div className="flex flex-wrap gap-2">
          <button onClick={openExport} className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-white font-semibold flex items-center gap-1.5">
            <Archive size={13} /> Εξαγωγή (αντιγραφή κειμένου)
          </button>
          <button onClick={() => { setMode("import"); setStatus(null); }} className="text-xs px-3 py-1.5 rounded-lg border border-slate-300 font-semibold flex items-center gap-1.5">
            <Plus size={13} /> Εισαγωγή (επικόλληση κειμένου)
          </button>
        </div>
      )}

      {mode === "export" && (
        <div>
          <textarea readOnly value={exportText} rows={5} className="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] font-mono" onFocus={(e) => e.target.select()} />
          <div className="flex gap-2 mt-2">
            <button onClick={copyExport} className="text-xs px-3 py-1.5 rounded-lg bg-teal-700 text-white font-semibold">{copied ? "Αντιγράφηκε ✓" : "Αντιγραφή"}</button>
            <button onClick={() => setMode(null)} className="text-xs px-3 py-1.5 rounded-lg border border-slate-300">Κλείσιμο</button>
          </div>
          <p className="text-[10px] text-slate-400 mt-1">Αν το κουμπί δεν δουλέψει, πάτα μέσα στο κείμενο (επιλέγεται αυτόματα) και αντέγραψε με το χέρι.</p>
        </div>
      )}

      {mode === "import" && (
        <div>
          <textarea
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
            rows={5}
            placeholder="Επικόλλησε εδώ το κείμενο αντιγράφου ασφαλείας…"
            className="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-[10px] font-mono"
          />
          <div className="flex gap-2 mt-2">
            <button onClick={applyImport} className="text-xs px-3 py-1.5 rounded-lg bg-teal-700 text-white font-semibold">Εφαρμογή</button>
            <button onClick={() => { setMode(null); setImportText(""); }} className="text-xs px-3 py-1.5 rounded-lg border border-slate-300">Άκυρο</button>
          </div>
        </div>
      )}
      {status && (
        <p className={`text-xs mt-2 font-semibold ${status.ok ? "text-teal-700" : "text-red-600"}`}>{status.msg}</p>
      )}
    </Card>
  );
}

        <button onClick={startEdit} className="text-[11px] text-teal-700 underline">

function AdminGate({ code, unlocked, setUnlocked, children }) {
  const [input, setInput] = useState("");
  const [error, setError] = useState(false);

  if (unlocked) return children;

    e.preventDefault();
    if (input === code) { setUnlocked(true); setError(false); }

  return (
    <Card>
      <p className="text-sm font-bold text-slate-800 mb-1 flex items-center gap-1.5">

}

const RETENTION_MONTHS = 24;

function monthsAgo(mk) {
  const [y, m] = mk.split("-").map(Number);
  const now = new Date();
  return (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
}

function MonthlyRetentionPanel({ ccpData, setCcpData, cleanData, setCleanData, oilData, setOilData, records, setRecords }) {
  const months = [...new Set([...Object.keys(ccpData || {}), ...Object.keys(cleanData || {}), ...Object.keys(oilData || {})])].sort();
  const [confirming, setConfirming] = useState(null);
  const [responsible, setResponsible] = useState("");

  const deleteMonth = (mk) => {
    const next1 = { ...ccpData }; delete next1[mk]; setCcpData(next1);
    const next2 = { ...cleanData }; delete next2[mk]; setCleanData(next2);
    const next3 = { ...oilData }; delete next3[mk]; setOilData(next3);
    const [y, m] = mk.split("-");
    const lastDay = new Date(Number(y), Number(m), 0).getDate();
    setRecords([{
      id: uid(), code: `Καταγραφές ποιότητας ${mk}`,
      from: `${mk}-01`, to: `${mk}-${String(lastDay).padStart(2, "0")}`,
      destroyDate: todayISO(), responsible,
      notes: `Αυτόματη διαγραφή μετά την παρέλευση ${RETENTION_MONTHS} μηνών τήρησης.`,
    }, ...records]);
    setConfirming(null);
    setResponsible("");
  };

  if (months.length === 0) return null;

  return (
    <Card className="mb-4 border-2 border-slate-800">
      <p className="text-xs font-bold uppercase tracking-wide text-slate-800 mb-1 flex items-center gap-1.5">
        <Archive size={14} /> Διατήρηση Καταγραφών Ποιότητας
      </p>
      <p className="text-xs text-slate-500 mb-3">
        Οι μηνιαίες καταγραφές (θερμοκρασίες/καθαριότητα/λάδι) τηρούνται {RETENTION_MONTHS} μήνες. Εξήγαγε πρώτα σε PDF από τις «Καταγραφές» πριν διαγράψεις.
      </p>
      <div className="space-y-1.5">
        {months.map((mk) => {
          const age = monthsAgo(mk);
          const eligible = age >= RETENTION_MONTHS;
          return (
            <div key={mk} className="flex items-center justify-between text-sm border-b border-slate-100 pb-1.5">
              <span className="text-slate-700">{mk} <span className="text-xs text-slate-400">({age} μήνες)</span></span>
              {eligible ? (
                confirming === mk ? (
                  <div className="flex items-center gap-1">
                    <input
                      placeholder="Υπεύθυνος"
                      value={responsible}
                      onChange={(e) => setResponsible(e.target.value)}
                      className="w-24 border border-red-300 rounded px-1.5 py-1 text-xs"
                    />
                    <button onClick={() => deleteMonth(mk)} className="text-xs px-2 py-1 rounded bg-red-600 text-white font-semibold">Επιβεβαίωση</button>
                    <button onClick={() => setConfirming(null)} className="text-xs px-2 py-1 rounded border border-slate-300">Άκυρο</button>
                  </div>
                ) : (
                  <button onClick={() => setConfirming(mk)} className="text-xs px-2.5 py-1 rounded-lg border border-red-300 text-red-600 font-semibold">Διαγραφή</button>
                )
              ) : (
                <span className="text-[10px] text-slate-400">τηρείται ακόμη {RETENTION_MONTHS - age} μήνες</span>
              )}
            </div>
          );
        })}
      </div>
    </Card>
  );
}

function App() {
  const [employees, setEmployees, empLoaded] = useStore("employees", []);
  const [sessions, setSessions] = useStore("training-sessions", []);
  const [packageCompletions, setPackageCompletions] = useStore("training-packages", []);
  const [ccpData, setCcpData] = useStore("ccp-logs", {});
  const [stations, setStations] = useStore("fridge-stations", DEFAULT_FRIDGE_STATIONS);

  // migration: παλιά «Αποθήκη 7 (πατάτας)» χωρίς θερμοκρασία → «Ψυγείο Πατάτας»
  useEffect(() => {
    const potato = stations.find((s) => s.id === "apo7");
    if (potato && potato.type === "dry") {
      setStations(stations.map((s) => (s.id === "apo7" ? { ...s, name: "Ψυγείο Πατάτας", type: "fridge" } : s)));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stations]);
  const [shiftNames, setShiftNames] = useStore("shift-names", { Α: "Πρωινή", Β: "Μεσημεριανή", Γ: "Βραδινή" });
  const [subTabLabels, setSubTabLabels] = useStore("subtab-labels", {});
  const [displayItems, setDisplayItems] = useStore("display-items", DEFAULT_DISPLAY_ITEMS);

  // migration: αφαίρεση τοστ/σαλάτας/γλυκισμάτων και του ίδιου του «Παγωτό» (μένουν μόνο οι κάδοι)
  useEffect(() => {
    const REMOVE_IDS = ["vtoast", "vsalad", "vsweet", "vsoft"];
    const hasBanned = displayItems.some((d) => REMOVE_IDS.includes(d.id));
    if (!hasBanned) return;
    setDisplayItems(displayItems.filter((d) => !REMOVE_IDS.includes(d.id)));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [displayItems]);

  const [cleaningAreas, setCleaningAreas, cleaningAreasLoaded] = useStore("cleaning-areas", DEFAULT_CLEANING_AREAS);
  const [cleanData, setCleanData, cleanDataLoaded] = useStore("cleaning-logs", {});

  // migration: καθαριότητα από (area-string, [name,freq]) → (id σταθερό) ώστε η μετονομασία να μη σπάει το ιστορικό
  useEffect(() => {
    if (!cleaningAreasLoaded || !cleanDataLoaded) return; // περιμένουμε να φορτώσουν ΚΑΙ τα δύο πριν αγγίξουμε τίποτα
    if (!cleaningAreas.length) return;
    const alreadyMigrated = !!cleaningAreas[0].id && !Array.isArray(cleaningAreas[0].items[0]);
    if (alreadyMigrated) return;
    const keyMap = {};
    const migrated = cleaningAreas.map((g, gi) => {
      const areaId = g.id || `a${gi}`;
      const items = g.items.map((it, ii) => {
        const isOld = Array.isArray(it);
        const name = isOld ? it[0] : it.name;
        const freq = isOld ? it[1] : it.freq;
        const itemId = !isOld && it.id ? it.id : `${areaId}i${ii}`;
        keyMap[`${g.area}__${name}`] = `${areaId}__${itemId}`;
        return { id: itemId, name, freq };
      });
      return { id: areaId, area: g.area, items };
    });
    const newCleanData = {};
    Object.entries(cleanData).forEach(([mk, days]) => {
      newCleanData[mk] = {};
      Object.entries(days).forEach(([date, shifts]) => {
        newCleanData[mk][date] = {};
        Object.entries(shifts).forEach(([shift, entries]) => {
          const newEntries = {};
          Object.entries(entries).forEach(([k, v]) => { newEntries[keyMap[k] || k] = v; });
          newCleanData[mk][date][shift] = newEntries;
        });
      });
    });
    setCleaningAreas(migrated);
    setCleanData(newCleanData);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cleaningAreasLoaded, cleanDataLoaded, cleaningAreas, cleanData]);
  const [oilData, setOilData] = useStore("oil-logs", {});
  const [records, setRecords] = useStore("archive-records", []);
  const [businessInfo, setBusinessInfo] = useStore("business-info", DEFAULT_BUSINESS_INFO);
  const [technicianVisits, setTechnicianVisits] = useStore("technician-visits", []);
  const [adminCode, setAdminCode] = useStore("admin-code", "1234");
  const [safetyTechnician, setSafetyTechnician] = useStore("safety-technician", {});
  const [adminUnlocked, setAdminUnlocked] = useState(false); // μόνο για τη διάρκεια της συνεδρίας, όχι μόνιμο

  const [tab, setTab] = useState("daily");
  const [printContent, setPrintContent] = useState(null);

  // ξανακλείδωμα Προσωπικού/Εκπαίδευσης μετά από 15 λεπτά απουσίας
  const ADMIN_LOCK_GRACE_MS = 15 * 60 * 1000;
  const adminLeftAtRef = useRef(null);
  const prevTabRef = useRef(tab);
  useEffect(() => {
    const isAdminTab = (t) => t === "employees" || t === "training";
    const wasAdmin = isAdminTab(prevTabRef.current);
    const isAdmin = isAdminTab(tab);
    if (wasAdmin && !isAdmin) {
      adminLeftAtRef.current = Date.now();
    }
    if (isAdmin && adminLeftAtRef.current) {
      if (Date.now() - adminLeftAtRef.current > ADMIN_LOCK_GRACE_MS) setAdminUnlocked(false);
      adminLeftAtRef.current = null;
    }
    prevTabRef.current = tab;
  }, [tab]);

  const requestPrint = (node) => {
    setPrintContent(node);
    setTimeout(() => {
      window.print();
      setPrintContent(null);
    }, 80);
  };

  const getBackupText = () => {
    const data = {
      exportedAt: new Date().toISOString(),
      employees, sessions, packageCompletions, ccpData, cleanData, oilData, records, stations, shiftNames,
    };
    return JSON.stringify(data);
  };

  const importBackup = (data) => {
    if (data.employees) setEmployees(data.employees);
    if (data.sessions) setSessions(data.sessions);
    if (data.packageCompletions) setPackageCompletions(data.packageCompletions);
    if (data.ccpData) setCcpData(data.ccpData);
    if (data.cleanData) setCleanData(data.cleanData);
    if (data.oilData) setOilData(data.oilData);
    if (data.records) setRecords(data.records);
    if (data.stations) setStations(data.stations);
    if (data.shiftNames) setShiftNames(data.shiftNames);
  };

  const expiringSoon = employees.filter((e) => {
    const d = daysUntil(e.healthExpiry);
    return !e.departureDate && e.healthExpiry && d <= HEALTH_WARN_DAYS;
  });

  const tabs = [
    { id: "daily", label: "Καταγραφές", icon: ClipboardList },
    { id: "employees", label: "Προσωπικό", icon: Users },
    { id: "training", label: "Εκπαίδευση", icon: GraduationCap },
    { id: "haccp", label: "HACCP", icon: GitBranch },
    { id: "archive", label: "Αρχείο", icon: Archive },
  ];

  return (
    <div className="min-h-screen bg-[#F7F5F0] text-slate-800" style={{ fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      <PrintStyles />
      <header className="bg-slate-900 text-white px-4 py-4 sticky top-0 z-20 shadow-md no-print">
        <h1 className="text-lg font-extrabold tracking-tight flex items-center gap-2">
          <Sparkles size={20} className="text-teal-400" /> Αναψυκτήριο · Διαχείριση Ποιότητας
        </h1>
        {expiringSoon.length > 0 && (
          <div className="mt-2 flex items-center gap-1.5 text-amber-300 text-xs font-semibold">
            <AlertTriangle size={13} />
            {expiringSoon.length} βιβλιάρι{expiringSoon.length === 1 ? "ο υγείας λήγει" : "α υγείας λήγουν"} σύντομα
          </div>
        )}
      </header>

      <nav className="bg-white border-b border-slate-200 sticky top-[68px] z-10 overflow-x-auto no-print">
        <div className="flex px-2">
          {tabs.map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className={`flex flex-col items-center gap-1 px-4 py-2.5 text-[11px] font-semibold whitespace-nowrap border-b-2 transition-colors
                ${tab === t.id ? "border-teal-700 text-teal-800" : "border-transparent text-slate-400"}`}
            >
              <t.icon size={16} />
              {t.label}
            </button>
          ))}
        </div>
      </nav>

      <main className="max-w-2xl mx-auto p-4 pb-16 no-print">
        {tab === "employees" && (
          <AdminGate code={adminCode} unlocked={adminUnlocked} setUnlocked={setAdminUnlocked}>
            <EmployeesTab employees={employees} setEmployees={setEmployees} />
          </AdminGate>
        )}
        {tab === "training" && (
          <AdminGate code={adminCode} unlocked={adminUnlocked} setUnlocked={setAdminUnlocked}>
            <TrainingTab employees={employees} sessions={sessions} setSessions={setSessions} requestPrint={requestPrint} packageCompletions={packageCompletions} setPackageCompletions={setPackageCompletions} businessInfo={businessInfo} />
          </AdminGate>
        )}
        {tab === "daily" && (
          <DailyLogsTab
            ccpData={ccpData} setCcpData={setCcpData}
            cleanData={cleanData} setCleanData={setCleanData}
            oilData={oilData} setOilData={setOilData}
            stations={stations} setStations={setStations}
            displayItems={displayItems} setDisplayItems={setDisplayItems}
            cleaningAreas={cleaningAreas} setCleaningAreas={setCleaningAreas}
            shiftNames={shiftNames} setShiftNames={setShiftNames}
            subTabLabels={subTabLabels} setSubTabLabels={setSubTabLabels}
            requestPrint={requestPrint}
            businessInfo={businessInfo}
          />
        )}
        {tab === "haccp" && <HaccpFlowTab businessInfo={businessInfo} />}
        {tab === "archive" && (
          <ArchiveTab
            records={records} setRecords={setRecords}
            getBackupText={getBackupText} onImport={importBackup}
            ccpData={ccpData} setCcpData={setCcpData}
            cleanData={cleanData} setCleanData={setCleanData}
            oilData={oilData} setOilData={setOilData}
            businessInfo={businessInfo} setBusinessInfo={setBusinessInfo}
            technicianVisits={technicianVisits} setTechnicianVisits={setTechnicianVisits}
            adminCode={adminCode} setAdminCode={setAdminCode}
            safetyTechnician={safetyTechnician} setSafetyTechnician={setSafetyTechnician}
          />
        )}
      </main>

      {printContent && <div id="print-root">{printContent}</div>}
    </div>
  );
}

/* ============================================================
   ΚΛΕΙΔΩΜΑ ΜΕ ΚΩΔΙΚΟ (απλή "πόρτα", όχι πραγματική ασφάλεια)
   ============================================================ */
const UNLOCK_CODE = "6969";
const UNLOCK_KEY = STORAGE_PREFIX + "unlocked";

function PasswordGate({ children }) {
  const [unlocked, setUnlocked] = useState(() => {
    try { return window.localStorage.getItem(UNLOCK_KEY) === "yes"; } catch (e) { return false; }
  });
  const [code, setCode] = useState("");
  const [error, setError] = useState(false);

  const tryUnlock = (e) => {
    e.preventDefault();
    if (code === UNLOCK_CODE) {
      try { window.localStorage.setItem(UNLOCK_KEY, "yes"); } catch (e) {}
      setUnlocked(true);
      setError(false);
    } else {
      setError(true);
    }
  };

  if (unlocked) return children;

  return (
    <div className="min-h-screen bg-[#F7F5F0] flex items-center justify-center p-6">
      <form onSubmit={tryUnlock} className="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 w-full max-w-xs">
        <p className="text-xl font-black text-orange-600 mb-1">BREWTOPIA</p>
        <p className="text-xs text-slate-500 mb-4">Διαχείριση Ποιότητας — εισάγετε τον κωδικό πρόσβασης</p>
        <input
          type="password"
          inputMode="numeric"
          autoFocus
          value={code}
          onChange={(e) => { setCode(e.target.value); setError(false); }}
          className={`w-full border rounded-lg px-3 py-2 text-sm mb-2 ${error ? "border-red-400" : "border-slate-300"}`}
          placeholder="Κωδικός"
        />
        {error && <p className="text-xs text-red-600 mb-2">Λάθος κωδικός, δοκίμασε ξανά.</p>}
        <button type="submit" className="w-full bg-teal-700 text-white rounded-lg py-2 text-sm font-semibold">
          Είσοδος
        </button>
      </form>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(
    <PasswordGate>
      <App />
    </PasswordGate>
  );
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;color:#b91c1c;font-family:sans-serif;font-size:13px;white-space:pre-wrap;">Σφάλμα εφαρμογής: ' + (e && e.message ? e.message : e) + '</div>';
}
</script>
</body>
</html>
